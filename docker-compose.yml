services:
  web_chat_app:
    build: ./app
    container_name: web_chat_app
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - MODEL_NAME=gemma4:26b-a4b
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped